<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>施工実績の管理｜月輪合同会社</title><meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/admin-works.css">
<script defer src="../assets/js/firebase-config.js"></script><script defer src="../assets/js/works-model.js"></script>
<script defer src="../assets/js/works-data.js"></script><script type="module" src="../assets/js/admin-works.js"></script></head>
<body><main class="admin-wrap"><p><a href="../index.html">← 月輪合同会社のホームページ</a></p><h1>施工実績の管理</h1>
<p id="message" role="status" aria-live="polite"></p>
<section id="login-panel"><h2>管理者ログイン</h2><form id="login-form">
<label>メールアドレス<input id="email" type="email" autocomplete="username" required></label>
<label>パスワード<input id="password" type="password" autocomplete="current-password" required></label>
<button class="button primary" type="submit">ログイン</button></form></section>
<div id="session-panel" hidden><p id="account"></p><button id="logout" class="button" type="button">ログアウト</button></div>
<section id="manager" hidden><div class="admin-actions"><button id="new-work" class="button" type="button">新しい施工実績</button><button id="import-local" class="button" type="button">既存の施工写真を取り込む</button></div>
<p>実際の施工写真のみ掲載してください。Before / After が揃っていなくても草稿として保存できます。</p>
<div class="admin-layout"><section aria-label="施工実績の一覧"><h2>施工実績一覧</h2><div id="work-list"></div></section>
<section><h2 id="editor-heading">新しい施工実績</h2><form id="work-form">
<label>タイトル（必須）<input name="title" maxlength="120" required></label>
<label>カテゴリー<select name="category" required></select></label>
<label>施工年月（任意）<input name="date" type="month"></label>
<label>地区（任意）<input name="area" maxlength="120" placeholder="例：東京都板橋区"></label>
<label>物件タイプ（任意）<input name="propertyType" maxlength="120"></label>
<label>施工内容・説明<textarea name="description" maxlength="3000" rows="4"></textarea></label>
<div class="admin-photos">
<label>Before（施工前）<input id="before-file" type="file" accept="image/jpeg,image/png,image/webp"><img id="before-preview" alt="Before の写真プレビュー" hidden><span id="before-status">未選択</span></label>
<label>After（施工後）<input id="after-file" type="file" accept="image/jpeg,image/png,image/webp"><img id="after-preview" alt="After の写真プレビュー" hidden><span id="after-status">未選択</span></label></div>
<p>写真は向きを確認し、長辺1600px以下に縮小します。写真の内容は変更しません。</p>
<label class="check-label"><input id="real-confirm" type="checkbox">実際の施工写真で、公開する許可を確認しました</label>
<p id="publish-hint">公開には Before と After の両方が必要です。</p>
<div class="admin-actions"><button id="save-draft" class="button" type="submit">草稿を保存（公開中なら下架）</button><button id="publish" class="button primary" type="button">保存して公開</button><button id="unpublish" class="button" type="button" hidden>下架する</button><button id="delete" class="button" type="button" hidden>削除</button></div>
</form></section></div></section></main></body></html>
